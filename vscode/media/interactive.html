<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{CSP}}; script-src 'nonce-{{NONCE}}'; base-uri 'none'; form-action 'none';"><link rel="stylesheet" href="{{STYLE}}"><title>交互测试</title></head><body class="interactive"><main><div class="row"><strong id="program">手动交互测试</strong><span id="status" class="muted">未运行</span></div><div class="row"><button id="start" class="primary" type="button">▶ 开始</button><button id="stop" type="button" disabled>■ 停止</button><button id="copy" type="button">复制记录</button></div><div id="transcript" role="log" aria-label="通信记录" tabindex="0"></div><div class="row"><textarea id="reply" rows="2" placeholder="输入交互器的回复，Ctrl+Enter 发送" aria-label="交互器回复" disabled></textarea><button id="send" type="button" disabled>发送</button></div><div class="row"><label><input id="newline" type="checkbox" checked>追加换行</label><button id="eof" class="textButton" type="button" disabled>发送 EOF</button></div><p class="muted">你扮演交互器。← 程序输出，→ 你的回复。C++ 请使用 endl 或 flush 刷新输出。</p><p id="notice" role="status"></p></main><script nonce="{{NONCE}}" src="{{SCRIPT}}"></script></body></html>
