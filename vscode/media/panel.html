<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{CSP}}; script-src 'nonce-{{NONCE}}'; img-src {{CSP}}; base-uri 'none'; form-action 'none';"><link rel="stylesheet" href="{{STYLE}}"><title>CF Enhance</title></head>
<body><main>
<header><strong>CF Enhance</strong><span id="connection" class="badge">未连接</span></header>
<details id="connectionDetails"><summary id="connectionTitle">连接设置</summary><div class="settings"><p id="connectionHint"></p><div class="row"><button id="pair" type="button">复制配对码</button><button id="disconnect" class="textButton" type="button">断开</button></div><p id="portInfo"></p></div></details>
<section class="code"><div class="row"><select id="source" aria-label="代码来源"><option value="editor">当前文件</option><option value="selection">选中代码</option><option value="file">选定文件</option></select><button id="browse" class="textButton nowrap" type="button">选择文件…</button></div><div class="fileLine"><span id="sourceName"></span><small id="selectionInfo"></small></div><span id="sourceInfo" hidden></span></section>
<section><label for="target">题目</label><select id="target" aria-label="目标题目"><option value="manual">输入题号或链接</option></select><label id="manualLabel"><input id="problem" aria-label="题号或链接" placeholder="题号或 CF 链接，如 2246A" autocomplete="off"></label><span id="targetHint" hidden></span><button id="openProblem" type="button" hidden>看题</button></section>
<section><label for="language">语言</label><select id="language" aria-label="提交语言"><option value="cpp23">GNU G++23</option><option value="cpp20">GNU G++20</option><option value="cpp17">GNU G++17</option><option value="python3">Python 3</option><option value="pypy3">PyPy 3</option><option value="java21">Java 21</option><option value="rust">Rust</option></select></section>
<button id="submit" class="primary" type="button">提交</button><p id="notice" role="status" aria-live="polite"></p>
<div class="row tools"><button id="importCph" class="textButton" type="button">导入 CPH</button><button id="refresh" class="textButton" type="button">刷新结果</button></div>
<details class="more"><summary>样例测试</summary><button id="samples" class="textButton" type="button">本地测样例（C++）</button><section id="sampleSection" hidden><details><summary id="sampleSummary">样例结果</summary><div id="sampleResults"></div><button id="showOutput" class="textButton" type="button">完整输出</button></details></section>
</details><section class="history"><div id="tasks"></div></section>
</main><script nonce="{{NONCE}}" src="{{SCRIPT}}"></script></body></html>
