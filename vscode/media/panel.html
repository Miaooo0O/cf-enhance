<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{CSP}}; script-src 'nonce-{{NONCE}}'; img-src {{CSP}}; base-uri 'none'; form-action 'none';"><link rel="stylesheet" href="{{STYLE}}"><title>CF Enhance</title></head>
<body><main>
<header><strong>CF Enhance</strong><button id="connection" class="badge textButton" type="button" title="连接网页设置">本地模式</button></header>
<details id="connectionDetails" hidden><summary id="connectionTitle">连接网页</summary><div class="settings"><p id="connectionHint"></p><div class="row"><button id="pair" type="button">复制配对码</button><button id="disconnect" class="textButton" type="button">断开</button></div><p id="portInfo"></p></div></details>
<section class="code"><div class="row"><select id="source" aria-label="代码来源"><option value="editor">当前文件</option><option value="selection">选中代码</option><option value="file">选定文件</option></select><button id="browse" class="textButton nowrap" type="button">选择文件…</button></div><div class="fileLine"><span id="sourceName"></span><small id="selectionInfo"></small></div><span id="sourceInfo" hidden></span></section>
<section class="targetControls"><div class="row"><button id="followWeb" class="iconButton" type="button" aria-label="跟随网页题目" aria-pressed="true" title="跟随网页题目">⇄</button><select id="target" aria-label="目标题目"><option value="manual">输入题号或链接</option></select><select id="language" aria-label="提交语言"><option value="cpp23">G++23</option><option value="cpp20">G++20</option><option value="cpp17">G++17</option><option value="python3">Python 3</option><option value="pypy3">PyPy 3</option><option value="java21">Java 21</option><option value="rust">Rust</option></select></div><label id="manualLabel"><input id="problem" aria-label="题号或链接" placeholder="题号 / CF 链接" autocomplete="off"></label><span id="targetHint" hidden></span><button id="openProblem" type="button" hidden>看题</button></section>
<div class="row actionBar"><button id="runAll" class="primary" type="button" title="运行全部用例">▶ 运行</button><button id="stopTests" type="button" title="停止运行" aria-label="停止运行" hidden>■</button><button id="submit" class="primary" type="button">↑ 提交</button></div>
<div id="tasks"></div>
<section id="judgePane"><div class="row tools"><span id="judgeInfo" class="muted"></span><div class="caseTools"><button id="addCase" class="iconButton" type="button" title="添加用例" aria-label="添加用例">＋</button><button id="syncSamples" class="iconButton" type="button" title="同步网页样例" aria-label="同步网页样例">⇩</button><button id="foldCases" class="iconButton" type="button" title="折叠全部" aria-label="折叠全部">⊟</button><button id="interactive" class="iconButton" type="button" title="交互测试窗口" aria-label="交互测试窗口">⇆</button><button id="judgeSettings" class="iconButton" type="button" title="设置" aria-label="设置">⚙</button><button id="showOutput" class="iconButton" type="button" title="完整日志" aria-label="完整日志">≡</button><button id="refresh" type="button" hidden>刷新</button></div></div><p id="judgeStale" class="muted" hidden>代码已修改</p><pre id="compileError" class="diagnostic" hidden></pre><div id="cases"></div><div class="row"><span id="sampleState" class="muted"></span><button id="undoCase" class="textButton" type="button" hidden>撤销删除</button></div></section>
<details id="taskHistory" hidden><summary id="historyTitle">提交历史</summary><div id="historyTasks"></div></details>
<p id="notice" role="status" aria-live="polite"></p>
</main><script nonce="{{NONCE}}" src="{{JUDGE}}"></script><script nonce="{{NONCE}}" src="{{SCRIPT}}"></script></body></html>
