<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{CSP}}; script-src 'nonce-{{NONCE}}'; img-src {{CSP}}; base-uri 'none'; form-action 'none';"><link rel="stylesheet" href="{{STYLE}}"><title>CF Enhance</title></head>
<body><main>
 <header><div><span class="eyebrow">CODEFORCES</span><h1>准备好下一次提交</h1></div><span id="connection" class="badge">未连接</span></header>
 <section class="connectionBox"><div class="between"><div><strong id="connectionTitle">连接浏览器</strong><p id="connectionHint">首次连接后即可在这里选题、提交和查看结果。</p></div><button id="pair" class="secondary" type="button">复制配对码</button></div><details><summary>连接详情</summary><p id="portInfo"></p><button id="disconnect" class="textButton" type="button">撤销配对</button></details></section>
 <section><div class="sectionTitle"><h2>代码来源</h2><span id="selectionInfo"></span></div><select id="source" aria-label="代码来源"><option value="editor">跟随当前代码文件</option><option value="selection">只使用当前选区</option><option value="file">使用选定文件</option></select><div class="sourceCard"><strong id="sourceName">尚未打开代码文件</strong><span id="sourceInfo"></span><button id="browse" class="textButton" type="button">选择其他文件…</button></div></section>
 <section><h2>目标题目</h2><select id="target" aria-label="目标题目"><option value="manual">输入题号或链接</option></select><label id="manualLabel"><span class="srOnly">CF 题号或链接</span><input id="problem" placeholder="例如 2246A，或粘贴 CF 题目链接" autocomplete="off"></label><div class="between targetActions"><span id="targetHint"></span><button id="openProblem" class="textButton" type="button">网页看题 ↗</button></div><label class="fieldLabel" for="language">提交语言</label><select id="language" aria-label="提交语言"><option value="cpp23">GNU G++23</option><option value="cpp20">GNU G++20</option><option value="cpp17">GNU G++17</option><option value="python3">Python 3</option><option value="pypy3">PyPy 3</option><option value="java21">Java 21</option><option value="rust">Rust</option><option value="manual">到网页手动选择</option></select></section>
 <section class="submitArea"><button id="submit" class="primary" type="button">准备提交 →</button><button id="samples" class="secondary" type="button">运行网页当前题样例（C++）</button><p id="submitHint">读取选定代码的最新内容；CF 网页中的最终 Submit 由你确认。</p><p id="notice" role="status" aria-live="polite"></p></section>
 <section id="sampleSection" hidden><div class="sectionTitle"><h2>本地样例结果</h2><button id="showOutput" class="textButton" type="button">完整输出 ↗</button></div><p id="sampleSummary"></p><div id="sampleResults"></div></section>
 <section><div class="sectionTitle"><h2>最近提交</h2><button id="refresh" class="textButton" type="button">刷新</button></div><div id="tasks"><p class="empty">这里会显示本次提交的进度和结果。</p></div></section>
</main><script nonce="{{NONCE}}" src="{{SCRIPT}}"></script></body></html>
